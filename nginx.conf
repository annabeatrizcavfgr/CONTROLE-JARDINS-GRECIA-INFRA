server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # rota de saúde (o Coolify pode usar para checar se subiu)
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # a página muda a cada deploy: o navegador sempre confere se há versão nova
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
