<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Controle Jardins Grécia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: casca do app de Pedidos (barra lateral vinho + faixa de números + kanban por status) com a Matriz GUT do Sprint dentro de .gut.
   Dois conjuntos de cores: --s-* (Sprint, usado por .gut e pelos menus flutuantes) e --p-* (Pedidos, usado por .pd). */
:root{
  /* Sprint (valores que colidem com os de Pedidos) */
  --s-bg:#F5F6F3; --s-surface:#FFFFFF; --s-surface-2:#EAEDE8; --s-accent:#9F1814; --s-accent-soft:#F9E8E7; --s-info:#1F4E79; --s-warn:#93662C;
  --s-shadow:0 1px 2px rgba(20,28,38,.05), 0 10px 26px rgba(20,28,38,.07);
  /* Sprint (exclusivos) */
  --border:#DDE1DA; --text:#1B2430; --text-muted:#5C6570; --accent-strong:#7F100D;
  --good:#3E7A54; --good-soft:#E3EFE6; --warn-soft:#F0E7D5; --critical:#AC4436; --critical-soft:#F5E3E0;
  --radius:12px; --head:#3E4659; --info-soft:#E5EDF4; --info-strong:#153A5B;
  --font-display:'Montserrat','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  --font-body:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  --font-mono:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  /* Pedidos (que colidem) */
  --p-bg:#f3f2f5; --p-surface:#ffffff; --p-surface-2:#faf9fb; --p-accent:#7a1f2b; --p-accent-soft:#f7eaec; --p-info:#2a5d91; --p-warn:#8c6000;
  --p-shadow:0 1px 2px rgba(31,27,33,.06), 0 1px 3px rgba(31,27,33,.04);
  /* Pedidos (exclusivos) */
  --ink:#1f1b21; --ink-2:#3e3842; --muted:#6f6874; --line:#e5e1e8; --line-2:#eeebf0; --accent-2:#5d1722; --accent-ink:#ffffff;
  --side-bg:#2a0f14; --side-ink:#f4e9eb; --side-muted:#b99ea4; --side-hover:rgba(255,255,255,.07); --side-on:rgba(255,255,255,.13); --side-line:rgba(255,255,255,.1); --side-accent:#f0a3ad;
  --ok:#17794a; --bad:#b3261e;
  --st0:#d4493e; --st1:#4aa3df; --st2:#3b7fd6; --st3:#7b61d1; --st4:#1fa39a; --st5:#dd9d12; --st6:#2f9e5f;
  --col:#eceaef; --shadow-2:0 6px 18px rgba(31,27,33,.12);
  --sans:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --s-bg:#10161C; --s-surface:#171F27; --s-surface-2:#1E2830; --s-accent:#E0645D; --s-accent-soft:#3A1F1E; --s-info:#6C9FCB; --s-warn:#D3A459;
  --s-shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
  --border:#2B3742; --text:#E8EAE5; --text-muted:#98A1A8; --accent-strong:#F0948E;
  --good:#71AC80; --good-soft:#1C3324; --warn-soft:#3A2E18; --critical:#DC7A6E; --critical-soft:#3D211E;
  --head:#2C3744; --info-soft:#1F3546; --info-strong:#93BEE0;
  --p-bg:#141116; --p-surface:#1e1a21; --p-surface-2:#231f27; --p-accent:#e58f9b; --p-accent-soft:#3a1d24; --p-info:#8fbbe8; --p-warn:#e6bd5c;
  --p-shadow:0 1px 2px rgba(0,0,0,.4);
  --ink:#efeaf2; --ink-2:#d6cfda; --muted:#a39bab; --line:#36303c; --line-2:#2c2731; --accent-2:#f0a3ad; --accent-ink:#240a0e;
  --side-bg:#0f0b10; --side-ink:#efe6e9; --side-muted:#9a8b90; --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.1); --side-line:rgba(255,255,255,.08); --side-accent:#e58f9b;
  --ok:#6fd49a; --bad:#f08f87;
  --st0:#ee7469; --st1:#6bb8ee; --st2:#6ea2f0; --st3:#9d87e8; --st4:#45c4ba; --st5:#efb73f; --st6:#58c183;
  --col:#1a161d; --shadow-2:0 8px 22px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --s-bg:#10161C; --s-surface:#171F27; --s-surface-2:#1E2830; --s-accent:#E0645D; --s-accent-soft:#3A1F1E; --s-info:#6C9FCB; --s-warn:#D3A459;
  --s-shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
  --border:#2B3742; --text:#E8EAE5; --text-muted:#98A1A8; --accent-strong:#F0948E;
  --good:#71AC80; --good-soft:#1C3324; --warn-soft:#3A2E18; --critical:#DC7A6E; --critical-soft:#3D211E;
  --head:#2C3744; --info-soft:#1F3546; --info-strong:#93BEE0;
  --p-bg:#141116; --p-surface:#1e1a21; --p-surface-2:#231f27; --p-accent:#e58f9b; --p-accent-soft:#3a1d24; --p-info:#8fbbe8; --p-warn:#e6bd5c;
  --p-shadow:0 1px 2px rgba(0,0,0,.4);
  --ink:#efeaf2; --ink-2:#d6cfda; --muted:#a39bab; --line:#36303c; --line-2:#2c2731; --accent-2:#f0a3ad; --accent-ink:#240a0e;
  --side-bg:#0f0b10; --side-ink:#efe6e9; --side-muted:#9a8b90; --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.1); --side-line:rgba(255,255,255,.08); --side-accent:#e58f9b;
  --ok:#6fd49a; --bad:#f08f87;
  --st0:#ee7469; --st1:#6bb8ee; --st2:#6ea2f0; --st3:#9d87e8; --st4:#45c4ba; --st5:#efb73f; --st6:#58c183;
  --col:#1a161d; --shadow-2:0 8px 22px rgba(0,0,0,.5); color-scheme:dark}
/* nomes genéricos: Sprint por padrão (menus flutuantes ficam no body), Pedidos dentro de .pd, Sprint de novo dentro de .gut */
:root{--bg:var(--s-bg);--surface:var(--s-surface);--surface-2:var(--s-surface-2);--accent:var(--s-accent);--accent-soft:var(--s-accent-soft);--info:var(--s-info);--warn:var(--s-warn);--shadow:var(--s-shadow)}
.pd{--bg:var(--p-bg);--surface:var(--p-surface);--surface-2:var(--p-surface-2);--accent:var(--p-accent);--accent-soft:var(--p-accent-soft);--info:var(--p-info);--warn:var(--p-warn);--shadow:var(--p-shadow)}
.pd .gut{--bg:var(--s-bg);--surface:var(--s-surface);--surface-2:var(--s-surface-2);--accent:var(--s-accent);--accent-soft:var(--s-accent-soft);--info:var(--s-info);--warn:var(--s-warn);--shadow:var(--s-shadow);
  color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--p-bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0;text-wrap:balance}
h3{font-family:var(--font-display)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg.i{flex:none;display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ===== casca do app de Pedidos ===== */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 14px 16px;gap:18px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:2px 6px 0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.04em;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.brand b{display:block;font-size:14.5px;font-weight:600;line-height:1.2}.brand span{display:block;font-size:12px;color:var(--side-muted);margin-top:2px}
.side .grupo{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:0 10px;margin:4px 0 6px}
#nav{display:flex;flex-direction:column;gap:2px}
.nv{position:relative;display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--side-ink);opacity:.82;padding:10px 12px;border-radius:9px;font:500 14px var(--sans);cursor:pointer;text-align:left}
.nv:hover{background:var(--side-hover);opacity:1}
.nv.on{background:var(--side-on);opacity:1;font-weight:600}
.nv.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--side-accent)}
.nv .bd{margin-left:auto;background:var(--side-accent);color:#2a0f14;border-radius:10px;padding:0 7px;font-size:11.5px;font-weight:700;min-width:20px;text-align:center}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 6px 0;display:flex;flex-direction:column;gap:8px}
.side-foot label{color:var(--side-muted);margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.side-foot select{width:100%;font:14px var(--sans);background:rgba(255,255,255,.08);color:var(--side-ink);border:1px solid var(--side-line);border-radius:8px;padding:8px 10px}
.side-foot select option{color:#1f1b21}
.side-foot input{width:100%;font:14px var(--sans);background:rgba(255,255,255,.08);color:var(--side-ink);border:1px solid var(--side-line);border-radius:8px;padding:8px 10px}
.side-foot input::placeholder{color:var(--side-muted)}
.side-foot .nota{font-size:11.5px;color:var(--side-muted);line-height:1.4}
.conteudo{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar h1{font-size:21px;font-weight:600;letter-spacing:-.01em}.bar p{color:var(--muted);font-size:13px;margin-top:1px}
.bar .esp{flex:1}
.burger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px;color:var(--ink);cursor:pointer}
.aviso-ex{margin:14px 28px 0;background:color-mix(in srgb,var(--warn) 12%,var(--surface));color:color-mix(in srgb,var(--warn) 80%,var(--ink));border:1px solid color-mix(in srgb,var(--warn) 25%,var(--surface));border-radius:10px;padding:8px 12px;font-size:12.5px}
main{padding:20px 28px 64px;display:flex;flex-direction:column;gap:18px;min-width:0}
main.wide{padding:14px 14px 48px}
.scrim{display:none}
@media (max-width:1500px) and (min-width:901px){.app{grid-template-columns:216px minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:276px;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow-2)}
  .side.aberto{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
  .burger{display:inline-flex}
  .bar{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}.bar h1{font-size:18px}
  main{padding:16px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
  main.wide{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .aviso-ex{margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
}
body.restricao-foco .side,body.restricao-foco .bar,body.restricao-foco .aviso-ex{display:none}
body.restricao-foco .app{grid-template-columns:minmax(0,1fr)}
body.restricao-foco main.wide{padding:8px 10px 10px}

/* ===== telas de controle (visual do app de Pedidos) ===== */
.m{color:var(--muted);font-size:12px}
.cod{font-family:var(--mono);font-size:12px}
.vazio{color:var(--muted);padding:22px;text-align:center;font-size:13px}
button.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:9px 15px;font:600 13px var(--sans);cursor:pointer;transition:background .12s,transform .06s}
button.b:hover{background:var(--accent-2);border-color:var(--accent-2)}button.b:active{transform:translateY(1px)}
button.b.sec{background:var(--surface);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}button.b.sec:hover{background:var(--accent-soft)}
button.b.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.sp{flex:1;min-width:0}
.kstrip{display:flex;gap:8px;flex-wrap:wrap}
.ks{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 14px 7px 11px;font:inherit;color:inherit;box-shadow:var(--shadow);cursor:default}
.ks svg{color:var(--accent)}.ks b{font-size:18px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}.ks span{font-size:12px;color:var(--muted)}
.ks.al{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}.ks.al b,.ks.al svg{color:var(--bad)}
.pd .card.qd{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 14px 8px;min-width:0}
.board{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 16px;align-items:flex-start;scroll-snap-type:x proximity;margin-inline:-2px}
.col{flex:0 0 272px;width:272px;max-width:272px;min-width:0;scroll-snap-align:start;padding:0 10px 12px;gap:9px;border:1px solid color-mix(in srgb,var(--c) 32%,var(--surface));border-top:0;border-radius:14px;min-height:150px;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--c) 10%,var(--surface));box-shadow:0 2px 8px color-mix(in srgb,var(--c) 16%,transparent)}
.col-h{display:flex;align-items:center;gap:9px;margin:0 -10px;padding:0 13px;height:56px;min-height:56px;border-radius:13px 13px 0 0;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 86%,#000),color-mix(in srgb,var(--c) 64%,#000))}
.col-h .pt{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28);flex:none}
.col-h b{flex:1;min-width:0;color:#fff;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col-h .qt{flex:none;background:rgba(255,255,255,.24);border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;color:#fff}
.col-s{font-size:11px;padding:0 2px;color:color-mix(in srgb,var(--c) 55%,var(--ink));font-weight:500;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.col.vazia{flex:0 0 190px;width:190px;max-width:190px;min-height:0;padding-bottom:10px;border-style:dashed;background:color-mix(in srgb,var(--c) 5%,var(--surface));box-shadow:none}
.col.vazia .col-h{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 60%,var(--surface)),color-mix(in srgb,var(--c) 48%,var(--surface)));border-radius:13px}
.col.vazia .col-h b,.col.vazia .col-h .qt{color:color-mix(in srgb,var(--c) 38%,#000)}
.col.vazia .col-h .pt{background:color-mix(in srgb,var(--c) 38%,#000);box-shadow:none}
.col.vazia .col-h .qt{background:rgba(255,255,255,.65)}
.kc{--c:var(--accent);background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 16%,var(--line));border-radius:9px;padding:8px 10px 8px 13px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 2px color-mix(in srgb,var(--c) 14%,transparent);font-size:13px;position:relative;overflow:hidden;transition:box-shadow .12s,transform .1s}
.kc:hover{transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 22%,transparent)}
.kc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.kc.emerg::before{background:var(--bad);width:4px}
.kc.parado{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.kc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:3px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2)}.tag i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.kc-t{font-weight:600;line-height:1.35;font-size:12.5px;overflow-wrap:anywhere}
.kc-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.chip{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--ink));white-space:nowrap}
.chip.ok{--c:var(--ok)}.chip.warn{--c:var(--warn)}.chip.bad{--c:var(--bad)}.chip.info{--c:var(--info)}.chip.acc{--c:var(--accent)}
.kc .chip{--c:var(--muted)}.kc .chip.bad{--c:var(--bad)}.kc .chip.info{--c:var(--info)}.kc .chip.warn{--c:var(--warn)}.kc .chip.ok{--c:var(--ok)}
.mini{display:inline-flex;gap:3px;align-items:center}.mini i{width:16px;height:5px;border-radius:3px;background:var(--line)}.mini i.ok{background:var(--st6)}.mini i.cur{background:var(--accent)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;transition:background .14s ease,border-color .14s ease,transform .1s ease,box-shadow .14s ease}
.btn:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.ico{display:inline-flex;width:16px;height:16px;flex:none;align-items:center;justify-content:center;vertical-align:-3px}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.section-title .ico,summary .ico,p .ico{margin-right:6px}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}
.context-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:6px max(24px,env(safe-area-inset-right,0px)) 6px max(24px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--border)}
#example-banner{margin:0;padding:6px 14px;border-radius:9px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:12.5px;font-weight:600}
body.on-restricoes #app{max-width:none}
.screen-enter{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.section-title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px 0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.badge-good{background:var(--good-soft);color:var(--good)}.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-critical{background:var(--critical-soft);color:var(--critical)}.badge-neutral{background:var(--surface-2);color:var(--text-muted)}
.badge-accent{background:var(--info-soft);color:var(--info-strong)}
.badge-del{background:transparent;border:none;padding:0;margin:0;color:inherit;font:inherit;font-size:12px;line-height:1;cursor:pointer;opacity:.65}
.badge-del:hover{opacity:1}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{text-align:center;font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;padding:0 10px 8px 10px;font-weight:700;border-bottom:1px solid var(--border)}
.rank-table th:first-child,.rank-table td:first-child{text-align:left}
.rank-table td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:center}
.rank-table tbody tr:last-child td{border-bottom:none}
.pkg-meta{font-size:12px;color:var(--text-muted)}
.num-cell{text-align:center;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty-note{color:var(--text-muted);font-size:13px;padding:18px 0;text-align:center}
.footer-note{color:var(--text-muted);font-size:11.5px;text-align:center;padding:10px 0 0 0}
select.inline{appearance:none;-webkit-appearance:none;font:inherit;font-weight:600;color:var(--text);cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:7px 32px 7px 12px;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238A939C' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 10px center/14px}
select.inline:hover{border-color:var(--info)}
.search-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;margin-bottom:12px}
.screen-tabs{display:inline-flex;gap:3px;margin-bottom:10px;padding:4px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);max-width:100%;overflow-x:auto}
.screen-tab{appearance:none;border:1px solid transparent;background:transparent;color:var(--text-muted);border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:700;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;transition:background .15s ease,color .15s ease;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.screen-tab:hover{color:var(--text)}
.screen-tab.active{background:var(--surface);border-color:var(--border);color:var(--accent);box-shadow:var(--shadow)}
details.card{padding:16px}
details.card summary{list-style:none;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.card summary::-webkit-details-marker{display:none}
details.card summary .chev{transition:transform .15s;font-size:11px}
details.card[open] summary .chev{transform:rotate(90deg)}

/* ===== Matriz GUT (CSS copiado do Sprint) ===== */
.panel-table-wrap{overflow:auto;max-width:100%}
.restricao-wrap{border:1px solid var(--border);border-radius:10px}
.restricao-table td.restricao-ed{cursor:text}
.restricao-table td.restricao-ed[data-campo="nivel"],.restricao-table td.restricao-ed[data-campo="status"],.restricao-table td.restricao-ed[data-campo="g"],.restricao-table td.restricao-ed[data-campo="u"],.restricao-table td.restricao-ed[data-campo="t"],.restricao-table td[data-draft-menu]{cursor:pointer}
.restricao-table td.restricao-ed:hover{box-shadow:inset 0 0 0 2px rgba(62,70,89,.35)}
.restricao-table td.restricao-lock{cursor:not-allowed}
.restricao-table td.restricao-editing{box-shadow:inset 0 0 0 2px #3E4659;background:var(--surface)}
.panel-table.restricao-table tbody td.restricao-editing,.panel-table.restricao-table tbody td.restricao-draft-cell{padding:4px}
.restricao-edit{width:100%;min-width:0;box-sizing:border-box;font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#222;text-align:left;resize:none}
.restricao-edit:focus{outline:2px solid #3E4659;outline-offset:-1px}
.restricao-table tr.restricao-draft-row td{background:var(--info-soft)}
.restricao-table td.restricao-draft-acoes{padding:4px;white-space:nowrap;text-align:center}
.restricao-draft-acoes .btn{padding:3px 6px;margin:0 1px;min-width:0}
.restricao-vazio{font-size:11px;color:var(--text-muted);font-style:italic}
.restricao-menu{position:fixed;z-index:9999;min-width:190px;max-height:60vh;overflow:auto;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.restricao-menu button{display:block;width:100%;text-align:left;padding:7px 10px;border:none;border-radius:6px;background:transparent;color:var(--text);font-size:13px;cursor:pointer}
.restricao-menu button:hover{background:var(--surface-2)}
.restricao-menu button.ativo{font-weight:700;background:var(--info-soft)}
.restricao-menu.restricao-datepop{min-width:250px;padding:12px}
.restricao-datepop .rd-titulo{font-family:var(--font-display);font-weight:700;font-size:12.5px;margin-bottom:8px}
.restricao-datepop input{width:100%;box-sizing:border-box;padding:8px 10px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px}
.restricao-datepop input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 22%,transparent)}
.restricao-datepop .rd-acoes{display:flex;align-items:center;gap:6px;margin-top:10px}
.restricao-menu.restricao-datepop button{display:inline-flex;width:auto;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:12.5px;font-weight:600;text-align:center}
.restricao-menu.restricao-datepop button:hover:not(:disabled){border-color:var(--info)}
.restricao-menu.restricao-datepop button:disabled{opacity:.45;cursor:default}
.restricao-menu.restricao-datepop button.rd-ok{background:var(--accent);border-color:var(--accent);color:#fff}
.panel-table.restricao-table{border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.3}
.panel-table.restricao-table th,.panel-table.restricao-table td{white-space:normal;padding:8px 7px}
.panel-table.restricao-table thead th{background:var(--head);color:#fff;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;border-bottom:none;border-right:1px solid rgba(255,255,255,.14);vertical-align:middle;padding:10px 7px;position:sticky;top:0;z-index:2}
.panel-table.restricao-table thead th:last-child{border-right:none}
.panel-table.restricao-table tbody td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:5px 7px}
.panel-table.restricao-table tbody td:last-child{border-right:none}
.panel-table.restricao-table tbody tr:last-child td{border-bottom:none}
.restricao-table td.left{max-width:150px;text-align:left}
.restricao-table td[data-campo="solucao"]{min-width:230px;max-width:560px}
.restricao-table td[data-campo="restricao"]{min-width:150px;max-width:340px}
.restricao-table .rt-cell{display:flex;align-items:flex-start;gap:6px}
.restricao-table .rt-clamp{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
.restricao-table .rt-clamp.aberto{display:block;overflow:visible;-webkit-line-clamp:unset}
.restricao-table .rt-mais{flex:none;width:20px;height:20px;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--info);font:inherit;font-size:15px;font-weight:700;line-height:1;cursor:pointer}
.restricao-table .rt-mais:hover{border-color:var(--info);background:var(--info-soft)}
.restricao-table .restricao-servico-cell{min-width:150px;max-width:110px;overflow-wrap:anywhere}
.restricao-table td[data-campo="restricao"]{overflow-wrap:anywhere}
.restricao-table .restricao-pill{min-width:0;padding:3px 9px;white-space:nowrap}
.restricao-table .restricao-nivel{padding:3px 9px;white-space:nowrap}
.restricao-table .restricao-cls{min-width:44px;padding:3px 8px;font-size:13px}
@media (max-width:1600px){
  .restricao-table .restricao-pill,.restricao-table .restricao-nivel{white-space:normal;padding:3px 7px;line-height:1.2}
  .panel-table.restricao-table thead th{font-size:10.5px;letter-spacing:0;padding:8px 3px}
  .panel-table.restricao-table tbody td{padding:4px 4px}
  .restricao-table td[data-campo="solucao"]{min-width:115px;max-width:420px}
  .restricao-table td[data-campo="restricao"]{min-width:95px;max-width:260px}
  .restricao-table .restricao-servico-cell{min-width:85px;max-width:110px}
  .restricao-table .restricao-cls{min-width:34px;padding:3px 6px}
  .restricao-table .restricao-gut-num{width:30px}
}
body.restricao-foco #topbar,body.restricao-foco .context-bar,body.restricao-foco .screen-tabs,body.restricao-foco #restricaoInd,body.restricao-foco #restricaoIRR{display:none}
body.restricao-foco .restricao-wrap{max-height:calc(100vh - 112px) !important}
.restricao-table .rf-btn{appearance:none;margin-left:3px;padding:0 4px;border:none;border-radius:4px;vertical-align:middle;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:11px;line-height:16px;cursor:pointer}
.restricao-table .rf-btn:hover{background:rgba(255,255,255,.3)}
.restricao-table .rf-btn.ativo{background:#F5D663;color:#25303b}
.restricao-filtro-pop{position:fixed;z-index:9999;width:250px;box-sizing:border-box;padding:8px;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.restricao-filtro-pop .rfp-busca{width:100%;box-sizing:border-box;margin:0 0 6px;padding:6px 8px;font-size:13px;font:inherit;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.restricao-filtro-pop .rfp-item{display:flex;align-items:center;gap:7px;margin:0;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:400;line-height:1.3;color:var(--text)}
.restricao-filtro-pop .rfp-item:hover{background:var(--surface-2)}
.restricao-filtro-pop .rfp-item input{margin:0;flex-shrink:0}
.restricao-filtro-pop .rfp-todos{font-weight:700}
.restricao-filtro-pop .rfp-lista{max-height:220px;overflow:auto;padding:2px;border:1px solid var(--border);border-radius:6px;margin-top:2px}
.restricao-filtro-pop .rfp-vazio{padding:8px;color:var(--text-muted)}
.restricao-filtro-pop .rfp-ord{display:block;width:100%;margin:0 0 2px;padding:7px 8px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;font-size:13px;font-weight:600;text-align:left;cursor:pointer}
.restricao-filtro-pop .rfp-ord:hover{background:var(--surface-2)}
.restricao-filtro-pop .rfp-ord.ativo{background:var(--info-soft);color:var(--info-strong)}
.restricao-filtro-pop .rfp-rodape{display:flex;align-items:center;gap:6px;margin-top:8px}
.restricao-table .rs-lbl{cursor:pointer;user-select:none}
.restricao-table .rs-lbl:hover{text-decoration:underline}
.restricao-table .rs-ind{margin-left:4px;font-size:9px;opacity:.95}
.restricao-pill{display:inline-block;min-width:92px;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-align:center;color:#25303b}
.restricao-pill-ok{background:#7FD6A2}.restricao-pill-andamento{background:#F5D663}.restricao-pill-novo{background:#DDE1E8}
.restricao-nivel{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#25303b}
.restricao-nivel-check-in{background:#CFE4FA}.restricao-nivel-sprint{background:#E0D4F5}.restricao-nivel-medio-prazo{background:#CDEDE6}.restricao-nivel-reuniao-diretoria{background:#F8D5DE}
.restricao-cls{display:inline-block;min-width:54px;padding:7px 10px;border-radius:6px;font-size:14px;font-weight:800;text-align:center;color:#25303b;font-family:var(--font-mono)}
.restricao-cls-hi{background:#F6A9A4}.restricao-cls-md{background:#FCDDB8}.restricao-cls-lo{background:#FFF4D6}
.restricao-gut-num{font-family:var(--font-mono);font-weight:600;width:38px;padding-left:3px;padding-right:3px}
.restricao-table td.restricao-atraso-cell{position:relative;background:#FDE6E6;color:#7a1f1f}
.restricao-atraso-flag{position:absolute;top:-1px;right:-1px;min-width:19px;height:19px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#E0252B;color:#fff;font-size:10.5px;font-weight:800;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.restricao-rodape{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 2px 0;font-size:12.5px;color:var(--text-muted)}
.restricao-busca{position:relative;flex:1;min-width:200px}
.restricao-busca .search-input{width:100%;margin:0;padding-left:34px;box-sizing:border-box}
.restricao-busca::before{content:"";position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);opacity:.5;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>") center/contain no-repeat}
/* indicadores */
.ind-topo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.ind-mes{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase}
.ind-mes select{font-size:13px;text-transform:none;min-width:150px}
.ind-pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--font-body);font-weight:400;color:var(--text)}
.ind-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:13px}
.ind-pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ind-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:980px){.ind-grade{grid-template-columns:1fr}}
.ind-box{border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0}
.ind-titulo{font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:2px}
.ind-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.ind-chip{padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.ind-chip:hover{border-color:var(--info)}
.ind-chip.ativo{background:var(--info-soft);border-color:var(--info);color:var(--info-strong)}
.restricao-ind-table{font-size:12.5px}
.restricao-ind-table thead th{background:var(--head);color:#fff;padding:9px 8px;font-size:11px;border-bottom:none}
.restricao-ind-table td{padding:8px;white-space:normal}
.restricao-ind-table td.left{text-align:left;max-width:300px}
.restricao-ind-table td.ind-atraso{background:#FDE6E6;color:#B3261E;font-weight:800;font-size:15px;width:80px}
.ind-bars{display:grid;grid-template-columns:minmax(0,max-content) minmax(80px,280px) 34px;column-gap:10px;row-gap:7px;align-items:center;justify-content:start;max-height:320px;overflow-y:auto;padding-right:6px;font-size:13px}
.ind-bar-row{display:contents}
.ind-bar-lbl{text-align:right;font-weight:600;max-width:340px;white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.ind-bar-track{display:block;height:20px;width:100%}
.ind-bar-fill{display:block;height:100%;border-radius:4px;background:var(--accent)}
.ind-bar-fill.vazio{background:var(--border)}
.ind-bar-n{font-weight:800;font-family:var(--font-mono)}
.irr-kpi{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:2px 0 12px}
.irr-pct{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1}
.irr-good-t{color:var(--good)}.irr-warn-t{color:var(--warn)}.irr-crit-t{color:var(--critical)}
.irr-tabela{font-size:12.5px}
.irr-tabela th,.irr-tabela td{white-space:nowrap;min-width:64px}
.irr-tabela td{padding:6px 8px;line-height:1.2}
.irr-tabela td span{display:block;font-size:10.5px;font-weight:500;opacity:.8}
.irr-tabela .irr-nome{text-align:left;font-weight:700;min-width:150px;position:sticky;left:0;background:var(--surface);z-index:1}
.irr-tabela thead th:first-child{position:sticky;left:0;z-index:2}
.irr-tabela tr.irr-todas td{border-bottom:2px solid var(--border)}
.irr-good{background:var(--good-soft);color:var(--good)}.irr-warn{background:var(--warn-soft);color:var(--warn)}.irr-crit{background:var(--critical-soft);color:var(--critical)}
.irr-nd{color:var(--text-muted);font-size:11px}
.irr-leg{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700}
.toast{position:fixed;bottom:18px;right:18px;z-index:10000;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
/* ===== telas de controle no formato do Acompanhamento (cartões com trilha de etapas) ===== */
.pd main:not(.wide) .card{padding:18px 20px;border-color:var(--line);border-radius:12px;box-shadow:var(--shadow);background:var(--surface)}
.pd main:not(.wide) .card h2{font-size:15.5px;font-weight:600;margin-bottom:2px;letter-spacing:-.005em;font-family:var(--sans)}
.pd .card.fbar{padding:10px 12px}
.fbar-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:7px;padding:5px 11px;font:600 12.5px var(--sans);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.busca{position:relative;flex:1 1 240px;min-width:200px;display:flex;align-items:center}
.busca svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.pd .busca input,.pd .filtros select{width:100%;font:13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;transition:border-color .12s,box-shadow .12s}
.pd .busca input{padding-left:32px}
.pd .busca input:focus-visible,.pd .filtros select:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.bd2{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;margin-left:2px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:2px 12px}
.filtros.mini{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.campo{display:flex;flex-direction:column;margin-bottom:8px}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ex-link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline;text-underline-offset:2px}
button.ic{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:3px 7px;border-radius:6px}button.ic:hover{background:var(--line-2);color:var(--ink)}
.board-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

/* ---------- quebra de palavra comprida por sílaba ---------- */
var SIL_V='aeiouyáàâãäéèêëíìîïóòôõöúùûü',SIL_G=['br','cr','dr','fr','gr','pr','tr','vr','bl','cl','fl','gl','pl','ch','lh','nh'];
function restricaoSilabasPalavra(w){
  var b=w.toLowerCase();function ehV(i){return SIL_V.indexOf(b[i])>=0}
  var cortes=[],i=0;
  while(i<w.length&&!ehV(i))i++;
  while(i<w.length){while(i<w.length&&ehV(i))i++;var ini=i;while(i<w.length&&!ehV(i))i++;if(i>=w.length)break;var k=i-ini;
    if(k===1)cortes.push(ini);else if(k>=2)cortes.push(SIL_G.indexOf(b.slice(i-2,i))>=0?i-2:i-1)}
  var ultimo=0,bons=[];cortes.forEach(function(c){if(c-ultimo>=2&&w.length-c>=2){bons.push(c);ultimo=c}});
  var out='',pos=0;bons.forEach(function(c){out+=w.slice(pos,c)+'­';pos=c});return out+w.slice(pos);
}
function restricaoSilabas(t){return String(t==null?'':t).replace(/[A-Za-zÀ-ÿ]{9,}/g,restricaoSilabasPalavra)}
function restricaoCelulaInner(campo,r){

    case 'nivel':return restricaoNivelLabel(r.nivel)?'<span class="restricao-nivel restricao-nivel-'+r.nivel+'">'+restricaoNivelLabel(r.nivel)+'</span>':'—';
    case 'data':return r.data?fmtDate2(r.data):'—';
    case 'dataResolucao':{var at=restricaoAtraso(r);return (r.dataResolucao?fmtDate2(r.dataResolucao):'—')+(at?'<span class="restricao-atraso-flag">'+at+'</span>':'')}
    case 'status':return '<span class="restricao-pill '+restricaoStatusPill(r.status)+'">'+restricaoStatusLabel(r.status)+'</span>';
    case 'g':case 'u':case 't':return r[campo]!=null?String(r[campo]):'—';
    case 'restricao':case 'solucao':{var txt=restricaoEsc(restricaoSilabas(r[campo]));if(!txt)return '—';if(!r.id)return txt;
      return '<div class="rt-cell"><div class="rt-clamp'+(RESTRICAO_ABERTAS.has(r.id+'|'+campo)?' aberto':'')+'">'+txt+'</div></div>'}
    default:return restricaoEsc(restricaoSilabas(r[campo]))||'—';
  }
}

  document.removeEventListener('mousedown',restricaoMenuFora,true);document.removeEventListener('keydown',restricaoMenuTecla,true);window.removeEventListener('scroll',restricaoFechaMenu,true);
}
function restricaoMenuFora(e){if(!e.target.closest('#restricaoMenu'))restricaoFechaMenu()}
function restricaoMenuTecla(e){if(e.key==='Escape'){e.preventDefault();restricaoFechaMenu()}}
function posMenu(m,td){
  var rc=td.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(rc.left,window.innerWidth-m.offsetWidth-8))+'px';
  var abaixo=rc.bottom+4+m.offsetHeight<=window.innerHeight;
  m.style.top=(abaixo?rc.bottom+4:Math.max(8,rc.top-4-m.offsetHeight))+'px';
  document.addEventListener('mousedown',restricaoMenuFora,true);document.addEventListener('keydown',restricaoMenuTecla,true);window.addEventListener('scroll',restricaoFechaMenu,true);
}
function restricaoAbreMenu(td,campo,atual,aoEscolher){
  restricaoFechaMenu();var ops=restricaoMenuOpcoes(campo);
  var m=document.createElement('div');m.id='restricaoMenu';m.className='restricao-menu';
  m.innerHTML=ops.map(function(o,i){return '<button type="button" data-i="'+i+'" class="'+((o.v===atual||(o.v==null&&atual==null))?'ativo':'')+'">'+restricaoEsc(o.label)+'</button>'}).join('');
  document.body.appendChild(m);
  m.querySelectorAll('button').forEach(function(b){b.onclick=function(){var o=ops[Number(b.dataset.i)];restricaoFechaMenu();aoEscolher(o.v)}});
  posMenu(m,td);
}
function restricaoAbreData(td,titulo,atual,aoEscolher){
  restricaoFechaMenu();
  var m=document.createElement('div');m.id='restricaoMenu';m.className='restricao-menu restricao-datepop';
  m.innerHTML='<div class="rd-titulo">'+titulo+'</div><input type="date" id="rdInput" value="'+restricaoEsc(atual)+'"><div class="rd-acoes"><button type="button" id="rdHoje">Hoje</button><button type="button" id="rdLimpar"'+(atual?'':' disabled')+'>Limpar</button><span style="flex:1"></span><button type="button" class="rd-ok" id="rdOk">OK</button></div>';
  document.body.appendChild(m);
  var inp=m.querySelector('#rdInput');function aplica(v){restricaoFechaMenu();aoEscolher(v)}
  m.querySelector('#rdHoje').onclick=function(){aplica(dia(0))};
  m.querySelector('#rdLimpar').onclick=function(){aplica('')};
  m.querySelector('#rdOk').onclick=function(){if(inp.value)aplica(inp.value);else restricaoFechaMenu()};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();m.querySelector('#rdOk').click()}});
  posMenu(m,td);inp.focus();

function restricaoGrava(id,patch){
  if(RESTRICAO_ORDEM)RESTRICAO_CONGELA=[].map.call(document.querySelectorAll('.restricao-table tbody tr[data-id]'),function(tr){return tr.dataset.id});
  var r=RESTRICOES.find(function(x){return x.id===id});if(r)Object.assign(r,patch);
  renderRestricoes();
}
function restricaoEditaCelula(td){
  if(td.querySelector('.restricao-edit'))return;
  var id=td.closest('tr').dataset.id,campo=td.dataset.campo,tipo=RESTRICAO_TIPO[campo];
  var r=RESTRICOES.find(function(x){return x.id===id});if(!r)return;
  if(tipo==='menu'){var atual=(campo==='status')?restricaoStatusKey(r.status):(r[campo]==null?null:r[campo]);
    restricaoAbreMenu(td,campo,atual,function(v){if(v!==atual){var p={};p[campo]=v;restricaoGrava(id,p)}});return}
  if(tipo==='date'){restricaoAbreData(td,campo==='dataResolucao'?'Data de resolução (prazo)':'Data da restrição',r[campo]||'',function(v){if((v||null)!==(r[campo]||null)){var p={};p[campo]=v||null;restricaoGrava(id,p)}});return}
  var antes=r[campo]==null?'':String(r[campo]);
  var rc=td.getBoundingClientRect();
  td.style.width=td.style.minWidth=td.style.maxWidth=rc.width+'px';td.style.height=rc.height+'px';
  var el=document.createElement(tipo==='area'?'textarea':'input');el.className='restricao-edit';el.value=antes;
  if(tipo==='area')el.style.height=Math.max(rc.height-14,34)+'px';
  if(campo==='servico')el.setAttribute('list','restricaoServicoList');else if(campo==='eng'||campo==='coordenador')el.setAttribute('list','dl-pessoas');
  td.classList.add('restricao-editing');td.textContent='';td.appendChild(el);
  if(tipo==='area')el.style.height=Math.min(Math.max(el.scrollHeight+2,parseFloat(el.style.height)||0),320)+'px';
  el.focus();el.select();
  var feito=false;
  function fim(salvar){
    if(feito)return;feito=true;var novo=el.value.trim();
    if(!salvar||novo===antes.trim()){renderRestricoes();return}
    if(campo==='restricao'&&!novo){toast('A restrição não pode ficar vazia.');renderRestricoes();return}
    var p={};p[campo]=novo;restricaoGrava(id,p);
  }
  el.addEventListener('keydown',function(e){if(e.key==='Enter'&&!(tipo==='area'&&e.shiftKey)){e.preventDefault();fim(true)}else if(e.key==='Escape'){e.preventDefault();fim(false)}});
  el.addEventListener('blur',function(){fim(true)});
}

/* ---------- indicadores ---------- */
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var ESCOPOS=[{v:'abertas',label:'Em aberto'},{v:'atrasadas',label:'Atrasadas'},{v:'finalizadas',label:'Finalizadas'},{v:'todas',label:'Todas'}];
function restricaoMesRotulo(ym){var p=ym.split('-');return MESES[Number(p[1])-1]+'/'+p[0]}
function restricaoPessoas(txt){return String(txt||'').split(/\s*[\/,;&]\s*|\s+e\s+/i).map(function(s){return s.trim()}).filter(Boolean)}
function restricaoContagem(lista,rotulos,vazio){
  var m=new Map();
  lista.forEach(function(r){var rs=rotulos(r);(rs.length?rs:[vazio]).forEach(function(nome){var k=restricaoNorm(nome);var a=m.get(k)||{label:nome.toUpperCase(),count:0,vazio:nome===vazio};a.count++;m.set(k,a)})});
  return Array.from(m.values()).sort(function(a,b){return (a.vazio-b.vazio)||(b.count-a.count)||a.label.localeCompare(b.label,'pt')});
}
function restricaoIndicadores(){
  var todas=restV();
  var set={};todas.forEach(function(r){var m=(r.data||'').slice(0,7);if(m)set[m]=1});
  var meses=Object.keys(set).sort().reverse();
  if(RESTRICAO_IND.mes&&meses.indexOf(RESTRICAO_IND.mes)<0)RESTRICAO_IND.mes='';
  var base=RESTRICAO_IND.mes?todas.filter(function(r){return (r.data||'').indexOf(RESTRICAO_IND.mes)===0}):todas;
  var fin=base.filter(function(r){return r.status==='resolvido'}),ab=base.filter(function(r){return r.status!=='resolvido'});
  var atr=ab.filter(function(r){return restricaoAtraso(r)>0});
  var grau=ab.filter(function(r){return restricaoCls(r)!=null}).sort(function(a,b){return restricaoCls(b)-restricaoCls(a)||(restricaoDias(b)||0)-(restricaoDias(a)||0)||a.item-b.item}).slice(0,5);
  var maisAtraso=atr.slice().sort(function(a,b){return restricaoAtraso(b)-restricaoAtraso(a)||(restricaoCls(b)||0)-(restricaoCls(a)||0)||a.item-b.item}).slice(0,5);
  var escopo={abertas:ab,atrasadas:atr,finalizadas:fin,todas:base}[RESTRICAO_IND.escopo]||ab;
  return {meses:meses,base:base,finalizadas:fin,abertas:ab,atrasadas:atr,grau:grau,maisAtraso:maisAtraso,escopo:escopo,
    semPrazo:ab.filter(function(r){return !r.dataResolucao}).length,semNota:ab.filter(function(r){return restricaoCls(r)==null}).length,
    porResp:restricaoContagem(escopo,function(r){return restricaoPessoas(r.eng)},'Sem responsável'),
    porServico:restricaoContagem(escopo,function(r){return String(r.servico||'').trim()?[String(r.servico).trim()]:[]},'Sem serviço')};
}
function restricaoIndTabela(titulo,sub,colLabel,linhas,celula,vazio){

  return '<div class="ind-box"><div class="ind-titulo">'+titulo+'</div><div class="pkg-meta" style="margin:0 0 8px">'+sub+'</div>'+(linhas.length?'<div style="overflow-x:auto"><table class="rank-table restricao-ind-table"><thead><tr><th>Item</th><th>Serviço</th><th>Restrição</th><th>'+colLabel+'</th></tr></thead><tbody>'+linhas.map(function(r){return '<tr><td class="num-cell mono">'+r.item+'</td><td>'+(restricaoEsc(r.servico)||'—')+'</td><td class="left" title="'+restricaoEsc(r.restricao)+'">'+restricaoEsc(cortar(r.restricao,95))+'</td>'+celula(r)+'</tr>'}).join('')+'</tbody></table></div>':'<p class="empty-note">'+vazio+'</p>')+'</div>';

function restricaoIndBarras(titulo,sub,dados){
  var max=Math.max.apply(null,[5].concat(dados.map(function(d){return d.count})));
  return '<div class="ind-box"><div class="ind-titulo">'+titulo+'</div><div class="pkg-meta" style="margin:0 0 8px">'+sub+'</div>'+(dados.length?'<div class="ind-bars">'+dados.map(function(d){return '<div class="ind-bar-row"><span class="ind-bar-lbl" title="'+restricaoEsc(d.label)+'">'+restricaoEsc(d.label)+'</span><span class="ind-bar-track"><span class="ind-bar-fill'+(d.vazio?' vazio':'')+'" style="width:'+Math.max(3,d.count/max*100)+'%"></span></span><span class="ind-bar-n">'+d.count+'</span></div>'}).join('')+'</div>':'<p class="empty-note">Nenhuma restrição nesse recorte.</p>')+'</div>';
}
function restricaoIRR(){
  var todas=restV();
  var comPrazo=todas.filter(function(r){return restricaoParseDia(r.dataResolucao)});
  function nova(){return {conc:0,venc:0,aVencer:0}}
  function soma(c,r){if(r.status==='resolvido')c.conc++;else if(restricaoAtraso(r)>0)c.venc++;else c.aVencer++}
  var ms={};comPrazo.forEach(function(r){ms[r.dataResolucao.slice(0,7)]=1});var meses=Object.keys(ms).sort();
  var linhas=new Map();
  function linha(nome,vazio){var k=vazio?'\u0000vazio':restricaoNorm(nome);if(!linhas.has(k))linhas.set(k,{label:nome.toUpperCase(),vazio:vazio,total:nova(),meses:new Map()});return linhas.get(k)}
  var todasLinha={label:'TODAS',total:nova(),meses:new Map()};
  function aplica(l,r){soma(l.total,r);var ym=r.dataResolucao.slice(0,7);if(!l.meses.has(ym))l.meses.set(ym,nova());soma(l.meses.get(ym),r)}
  comPrazo.forEach(function(r){aplica(todasLinha,r);var p=restricaoPessoas(r.eng);(p.length?p.map(function(x){return linha(x,false)}):[linha('Sem responsável',true)]).forEach(function(l){aplica(l,r)})});
  var porPessoa=Array.from(linhas.values()).sort(function(a,b){return (a.vazio-b.vazio)||a.label.localeCompare(b.label,'pt')});
  return {meses:meses,todasLinha:todasLinha,porPessoa:porPessoa,semPrazo:todas.length-comPrazo.length,comPrazo:comPrazo.length};
}
function restricaoIRRCelula(c){
  var base=c.conc+c.venc;
  if(!base)return c.aVencer?'<td class="irr-nd" title="'+c.aVencer+' a vencer — ainda fora do índice">'+c.aVencer+' a vencer</td>':'<td class="irr-nd">·</td>';
  var p=c.conc/base,cls=p>=0.8?'irr-good':p>=0.5?'irr-warn':'irr-crit';
  return '<td class="'+cls+'" title="'+c.conc+' concluída(s) de '+base+' (concluídas + vencidas em aberto)'+(c.aVencer?' · '+c.aVencer+' a vencer fora do índice':'')+'"><strong>'+Math.round(p*100)+'%</strong><span>'+c.conc+'/'+base+'</span></td>';
}
function restricaoIRRHtml(){
  var d=restricaoIRR(),tot=d.todasLinha.total,base=tot.conc+tot.venc,p=base?tot.conc/base:null;
  function mesCab(ym){var a=ym.split('-');return MESES[Number(a[1])-1].slice(0,3)+'/'+a[0].slice(2)}

/* Quando o orçamento abre o flow, o processo começa por lá: as três etapas da obra (criado, coordenador, gerente) não se aplicam. */
function normFlow(f){
  if(!f.origem)f.origem='Obra';
  if(!f.hist)f.hist={};
  if(f._dv===undefined){f._dv=f.desvio||'Fluxo padrão';if(f._dv!=='Fluxo padrão'&&!f.desvioDesde)f.desvioDesde=f.hist[f.etapa]||f.criada||hojeISO();}
  else if(f._dv!==(f.desvio||'Fluxo padrão')){f._dv=f.desvio||'Fluxo padrão';f.desvioDesde=hojeISO();}
  if(f.origem==='Orçamento'){
    if(f.etapa<3)f.etapa=3;
    [0,1,2].forEach(function(k){delete f.hist[k]});
    if(!f.hist[3])f.hist[3]=f.criada||hojeISO();
  }else{
    for(var j=0;j<=f.etapa;j++)if(!f.hist[j])f.hist[j]=f.criada||hojeISO();
  }
}

function syncSubst(alvo,v){if(Array.isArray(alvo)){alvo.length=0;(v||[]).forEach(function(x){alvo.push(x)})}else{Object.keys(alvo).forEach(function(k){delete alvo[k]});Object.keys(v||{}).forEach(function(k){alvo[k]=v[k]})}}
var SYNC_CFG={prazos_prj:{g:function(){return PRAZOS_PRJ},s:function(v){syncSubst(PRAZOS_PRJ,(v&&v.length===5)?v.slice(1):v)}},prazos_sup:{g:function(){return PRAZOS_SUP},s:function(v){syncSubst(PRAZOS_SUP,v)}},prazos_flow:{g:function(){return PRAZOS_FLOW},s:function(v){syncSubst(PRAZOS_FLOW,v)}},
  cad:{g:function(){return {obras:CAD.obras,tipos:CAD.tipos}},s:function(v){['obras','tipos'].forEach(function(k){if(v&&Array.isArray(v[k]))syncSubst(CAD[k],v[k])})}}};
/* forma "canônica" para comparar (ordem das chaves não importa; campos que começam com _ são só da tela e não vão) */
function canon(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  return '{'+Object.keys(v).filter(function(k){return k.charAt(0)!=='_'&&v[k]!==undefined}).sort().map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';
}
function limpo(v){return JSON.parse(canon(v))}
function syncReq(metodo,caminho,corpo,extra){
  var A=window.fgrAuth;
  return A.token().then(function(tok){
    var h={apikey:A.anon,Authorization:'Bearer '+tok,'Accept-Profile':SYNC_SCHEMA,'Content-Profile':SYNC_SCHEMA};
    if(corpo!==undefined)h['Content-Type']='application/json';
    if(extra)Object.keys(extra).forEach(function(k){h[k]=extra[k]});
    return fetch(A.url+'/rest/v1/'+caminho,{method:metodo,headers:h,body:corpo===undefined?undefined:JSON.stringify(corpo)});
  }).then(function(r){
    if(!r.ok){var e=new Error('http '+r.status);e.status=r.status;throw e}
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function syncBuscaTudo(filtro){
  var tudo=[],pag=1000;
  function pagina(ini){
    return syncReq('GET','docs?select=colecao,id,ord,value,updated_at,deleted&order=updated_at.asc,colecao.asc,id.asc'+(filtro||''),undefined,{Range:ini+'-'+(ini+pag-1),'Range-Unit':'items'}).then(function(rows){rows=rows||[];tudo=tudo.concat(rows);return rows.length===pag?pagina(ini+pag):tudo});
  }
  return pagina(0);
}
/* aplica no painel o que veio do banco; não mexe em item que tem alteração local ainda não enviada */
function syncAplica(rows,inicial){
  var mudou=false,tocadas={};
  rows.forEach(function(r){
    if(r.updated_at&&r.updated_at>SYNC.ultimo)SYNC.ultimo=r.updated_at;
    var chave=r.colecao+'/'+r.id;
    if(r.colecao==='config'){
      var c=SYNC_CFG[r.id];if(!c||r.deleted)return;
      var sv=canon(r.value),lc=canon(c.g());
      if(sv===lc){SYNC.snap[chave]=sv;return}
      if(inicial||lc===SYNC.snap[chave]){c.s(r.value);SYNC.snap[chave]=sv;mudou=true}
      return;
    }
    var col=SYNC_COLS[r.colecao];if(!col)return;
    SYNC.ord[chave]=Number(r.ord)||0;
    var arr=col.g(),i=-1;for(var j=0;j<arr.length;j++){if(arr[j]&&arr[j].id===r.id){i=j;break}}
    var snap=SYNC.snap[chave];
    if(r.deleted){
      if(i>=0&&(inicial||canon(arr[i])===snap)){arr.splice(i,1);mudou=true;tocadas[r.colecao]=1}
      delete SYNC.snap[chave];return;
    }
    var sv2=canon(r.value),sv3=sv2;
    if(r.colecao==='projetos'&&migraPrj(r.value))sv3=canon(r.value);   /* formato antigo: converte aqui e deixa o envio gravar a versão nova */
    if(i>=0){
      var lc2=canon(arr[i]);
      if(lc2===sv3){SYNC.snap[chave]=sv2;return}
      if(inicial||lc2===snap){arr[i]=r.value;SYNC.snap[chave]=sv2;mudou=true;tocadas[r.colecao]=1}
    }else{
      if(snap!==undefined&&!inicial)return;   /* eu apaguei este item e a exclusão ainda não foi enviada: não traz de volta */
      arr.push(r.value);SYNC.snap[chave]=sv2;mudou=true;tocadas[r.colecao]=1}
  });
  Object.keys(tocadas).forEach(function(k){SYNC_COLS[k].g().sort(function(a,b){return (SYNC.ord[k+'/'+a.id]||0)-(SYNC.ord[k+'/'+b.id]||0)})});
  return mudou;
}
function syncOcupado(){
  var a=document.activeElement;
  return !!(document.querySelector('#restricaoMenu,#restricaoFiltroPop,#cfPop,.restricao-editing,#nome-modal,.formc')||RESTRICAO_DRAFT||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)));
}
function syncRedesenha(){if(syncOcupado()){SYNC.pendente=true;return}SYNC.pendente=false;render()}
function syncAgenda(){if(!SYNC.ativo)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncEmpurra,window.FGR_PUSH_MS||400)}
function syncEmpurra(){
  if(!SYNC.ativo)return;
  if(SYNC.pushando){SYNC.denovo=true;return}
  var linhas=[],novos={},sumidos=[];
  Object.keys(SYNC_COLS).forEach(function(k){
    var arr=SYNC_COLS[k].g(),vistos={};
    arr.forEach(function(it){
      if(!it||!it.id)return;
      var ch=k+'/'+it.id,c=canon(it);vistos[ch]=1;
      if(SYNC.snap[ch]!==c){if(!SYNC.ord[ch])SYNC.ord[ch]=Date.now()*1000+(SYNC.seq++);linhas.push({colecao:k,id:it.id,ord:SYNC.ord[ch],value:limpo(it),deleted:false});novos[ch]=c}
    });
    Object.keys(SYNC.snap).forEach(function(ch){if(ch.indexOf(k+'/')===0&&!vistos[ch]){linhas.push({colecao:k,id:ch.slice(k.length+1),ord:SYNC.ord[ch]||0,value:{},deleted:true});sumidos.push(ch)}});
  });
  Object.keys(SYNC_CFG).forEach(function(k){
    var ch='config/'+k,v=SYNC_CFG[k].g(),c=canon(v);
    if(SYNC.snap[ch]!==c){linhas.push({colecao:'config',id:k,ord:0,value:limpo(v),deleted:false});novos[ch]=c}
  });
  if(!linhas.length)return;
  SYNC.pushando=true;
  syncReq('POST','docs?on_conflict=colecao,id',linhas,{Prefer:'resolution=merge-duplicates,return=minimal'}).then(function(){
    Object.keys(novos).forEach(function(ch){SYNC.snap[ch]=novos[ch]});
    sumidos.forEach(function(ch){delete SYNC.snap[ch]});
    SYNC.pushando=false;
    if(SYNC.estado==='erro'){SYNC.estado='ok';avisoRender()}
    if(SYNC.denovo){SYNC.denovo=false;syncAgenda()}
  }).catch(function(){
    SYNC.pushando=false;SYNC.denovo=false;SYNC.estado='erro';avisoRender();
    setTimeout(syncAgenda,5000);
  });
}
function syncPuxa(){
  if(!SYNC.ativo||SYNC.puxando)return;
  if(document.hidden&&!window.FGR_SYNC_TESTE)return;
  if(SYNC.pendente)syncRedesenha();
  SYNC.puxando=true;
  var desde=SYNC.ultimo?new Date(new Date(SYNC.ultimo).getTime()-5000).toISOString():'';
  syncBuscaTudo(desde?'&updated_at=gte.'+encodeURIComponent(desde):'').then(function(rows){
    SYNC.puxando=false;
    if(SYNC.estado==='erro'){SYNC.estado='ok';avisoRender()}
    if(rows.length&&syncAplica(rows,false))syncRedesenha();
    syncAgenda();
  }).catch(function(){SYNC.puxando=false;SYNC.estado='erro';avisoRender()});
}
window.fgrSyncStart=function(){
  if(SYNC.ativo||!window.fgrAuth)return;
  SYNC.ativo=true;SYNC.estado='carregando';avisoRender();
  var principal=$('#main');if(principal)principal.style.visibility='hidden';
  syncBuscaTudo('').then(function(rows){
    var total=RESTRICOES.length+PED.length+FLO.length+LIC.length+PRJ.length,manter=false;
    if(rows.length===0&&total>0&&!EXEMPLO)manter=window.confirm('O banco compartilhado ainda está vazio. Enviar para ele os '+total+' itens que estão neste navegador, para todos verem?');
    if(!manter)Object.keys(SYNC_COLS).forEach(function(k){SYNC_COLS[k].s([])});
    syncAplica(rows,true);
    SYNC.estado='ok';
    if(principal)principal.style.visibility='';
    avisoRender();render();syncAgenda();
    SYNC.poll=setInterval(syncPuxa,window.FGR_POLL_MS||8000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)syncPuxa()});
  }).catch(function(e){
    SYNC.ativo=false;SYNC.estado='erro';SYNC.detalhe=(e&&e.status)?('HTTP '+e.status):'sem resposta do servidor';
    try{console.warn('Dados compartilhados:',e)}catch(_){}
    if(principal)principal.style.visibility='';
    avisoRender();
  });
};
render();
})();
</script>
<script>
/* Login com a conta FGR (Microsoft/Entra) pelo Auth do Hydra (dados.hydra.fgr.com.br).
   Só liga no endereço *.hydra.fgr.com.br; em qualquer outro lugar (arquivo local, demonstração) o painel abre direto.
   A chave "anon" é pública por definição (não é a service_role). */
(function(){
var DADOS='https://dados.hydra.fgr.com.br',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkwNTMxMTMyLCJleHAiOjIxMDU4OTExMzJ9.qKTpmcEWW1lafrW0gXu3NDywbZenczkfgJrROhoM-1A',CHAVE='fgr_cjg_auth';
/* Login: ligue/desligue aqui. Precisa das Redirect URLs deste endereço no Auth do Hydra. */
var LOGIN_LIGADO=true;
var ATIVO=LOGIN_LIGADO&&(/\.hydra\.fgr\.com\.br$/i.test(location.hostname)||window.FGR_AUTH_TESTE===true);
if(!ATIVO)return;
var PERMITIDO=/@fgr\.com(\.br)?$/i,mem=null,gate=null;
function ler(){try{var v=localStorage.getItem(CHAVE);return v?JSON.parse(v):mem}catch(e){return mem}}
function gravar(s){mem=s;try{if(s)localStorage.setItem(CHAVE,JSON.stringify(s));else localStorage.removeItem(CHAVE)}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function bonito(n){n=String(n||'').trim();if(n&&n===n.toUpperCase())n=n.toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()});return n}
function urlEntrar(){return DADOS+'/auth/v1/authorize?provider=azure&scopes=email&redirect_to='+encodeURIComponent(location.origin+'/')}
window.__fgrAuthUrl=urlEntrar;
function mostrar(msg){
  if(!gate){
    gate=document.createElement('div');gate.id='auth-gate';
    gate.setAttribute('style','position:fixed;inset:0;z-index:100000;display:grid;place-items:center;padding:20px;background:var(--p-bg);color:var(--ink);font-family:var(--sans)');
    document.body.appendChild(gate);
  }
  var espera=(msg==='Entrando…');
  gate.innerHTML='<div style="max-width:400px;width:100%;background:var(--p-surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--p-shadow);padding:28px 26px;display:flex;flex-direction:column;gap:14px;text-align:center">'
   +'<div style="width:46px;height:46px;border-radius:12px;background:var(--p-accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;margin:0 auto">FGR</div>'
   +'<div style="font-size:19px;font-weight:600">Controle Jardins Grécia</div>'
   +'<div class="m" style="font-size:13.5px">Entre com a sua conta FGR (Microsoft).</div>'
   +(msg?'<div id="auth-msg" role="status" style="font-size:13px;color:'+(espera?'var(--muted)':'var(--bad)')+'">'+esc(msg)+'</div>':'')
   +(espera?'':'<button class="b" id="auth-entrar" style="align-self:center">Entrar com conta Microsoft</button>')
   +'</div>';
  var b=gate.querySelector('#auth-entrar');if(b)b.onclick=function(){location.href=urlEntrar()};
}
function esconder(){if(gate){gate.remove();gate=null}}
function chaveNome(s){return 'fgr_nome:'+String(s.email||'').toLowerCase()}
function nomeSalvo(s){try{return localStorage.getItem(chaveNome(s))||''}catch(e){return ''}}
function guardaNome(s,n){try{localStorage.setItem(chaveNome(s),n)}catch(e){}}
function definirNome(s){
  var n=nomeSalvo(s);
  if(n){window.fgrSetNome(n);linhaUsuario(s);return}
  window.fgrSetNome('');
  window.fgrPedirNome(bonito(s.name),function(novo){guardaNome(s,novo);window.fgrSetNome(novo);linhaUsuario(s)},true);
}function linhaUsuario(s){
  var foot=document.querySelector('.side-foot');if(!foot)return;
  var el=document.getElementById('auth-user');
  if(!el){el=document.createElement('div');el.id='auth-user';el.className='nota';foot.insertBefore(el,foot.querySelector('.nota'))}
  el.innerHTML='Entrou como <b>'+esc(nomeSalvo(s)||bonito(s.name)||s.email)+'</b><br><a href="#" id="auth-trocar" style="color:var(--side-accent)">Trocar nome</a> · <a href="#" id="auth-sair" style="color:var(--side-accent)">Sair</a>';
  document.getElementById('auth-trocar').onclick=function(ev){ev.preventDefault();window.fgrPedirNome(window.fgrNomeAtual()||bonito(s.name),function(n){guardaNome(s,n);window.fgrSetNome(n);linhaUsuario(s)},false)};
  var a=document.getElementById('auth-sair');
  a.onclick=function(ev){ev.preventDefault();
    var t=(ler()||{}).access_token;
    if(t)fetch(DADOS+'/auth/v1/logout',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+t}}).catch(function(){});
    window.fgrSetNome('');gravar(null);el.remove();mostrar('Você saiu. Entre de novo para continuar.');
    setTimeout(function(){location.reload()},60);
  };
}
function entrou(s){
  if(!PERMITIDO.test(s.email||'')){gravar(null);mostrar('A conta '+(s.email||'')+' não é uma conta FGR. Entre com o seu e-mail @fgr.com.br.');return}
  esconder();linhaUsuario(s);definirNome(s);if(window.fgrSyncStart)window.fgrSyncStart();
}
function usuario(tok){
  return fetch(DADOS+'/auth/v1/user',{headers:{apikey:ANON,Authorization:'Bearer '+tok}}).then(function(r){if(!r.ok)throw new Error('sessao');return r.json()});
}
function renovar(s){
  return fetch(DADOS+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})})
    .then(function(r){if(!r.ok)throw new Error('renovar');return r.json()})
    .then(function(j){var n={access_token:j.access_token,refresh_token:j.refresh_token||s.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,email:s.email,name:s.name};gravar(n);return n});
}
function iniciar(){
  var h=(location.hash||'').replace(/^#/,''),q=(location.search||'').replace(/^\?/,''),p=new URLSearchParams(h+'&'+q);
  var limpo=function(){history.replaceState(null,'',location.pathname)};
  if(p.get('error_description')||p.get('error')){limpo();mostrar('Não foi possível entrar: '+(p.get('error_description')||p.get('error')));return}
  if(p.get('access_token')){
    var tok=p.get('access_token'),ref=p.get('refresh_token'),exp=Number(p.get('expires_in'))||3600;
    limpo();mostrar('Entrando…');
    usuario(tok).then(function(u){
      var m=u.user_metadata||{};
      var s={access_token:tok,refresh_token:ref,expires_at:Date.now()+exp*1000,email:u.email,name:m.full_name||m.name||u.email};
      gravar(s);entrou(s);
    }).catch(function(){gravar(null);mostrar('Não consegui confirmar o seu login. Tente entrar de novo.')});
    return;
  }
  var s=ler();
  if(s&&s.expires_at>Date.now()+60000){entrou(s);return}
  if(s&&s.refresh_token){mostrar('Entrando…');renovar(s).then(entrou).catch(function(){gravar(null);mostrar('')});return}
  mostrar('');
}
function tokenValido(){
  var s=ler();if(!s)return Promise.reject(new Error('sem sessao'));
  if(s.expires_at>Date.now()+60000)return Promise.resolve(s.access_token);
  return renovar(s).then(function(n){return n.access_token});
}
window.fgrAuth={url:DADOS,anon:ANON,token:tokenValido,email:function(){var s=ler();return s?s.email:''}};
iniciar();
})();
</script>
